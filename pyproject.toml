[project]
name = "spmlex"
description = "Semi-parametric maximum likelihood estimation using the mixsqp algorithm and jax"
readme = "README.md"
authors = [{ name = "Paul Diegert", email = "pdiegert@gmail.com" }]
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
 "jaxlib>=0.9.2,<=0.9.2",
 "jax>=0.9.2,<=0.9.2",
 "mixsqpx==0.1.5",
 "equinox>=0.13.6,<0.14",
]

[dependency-groups]
dev = [
 "build>=1.2.2.post1,<2",
 "jaxopt>=0.8.5,<0.9",
 "pandas>=2.2.3,<3",
 "matplotlib>=3.10.1,<4",
 "seaborn>=0.13.2,<0.14",
 "pytest>=8.3.5,<9",
 "ipykernel>=6.29.5,<7",
 "pyyaml>=6.0.2,<7",
 "nbformat>=5.10.4,<6",
 "nbclient>=0.10.2,<0.11",
]

[tool.uv.sources]
mixsqpx = { path = "../mixsqpx/dist/mixsqpx-0.1.5-cp312-abi3-linux_x86_64.whl" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = ["dev"]
